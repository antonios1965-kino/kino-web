<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINO WEB</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(145deg,#eef4ff 0%,#f8fafc 48%,#edf7f4 100%);
 color:#152033;padding:32px 16px
}
.shell{max-width:760px;margin:0 auto}
.hero{
 background:#fff;border:1px solid #e1e7ef;border-radius:24px;
 padding:28px 22px;margin-bottom:22px;text-align:center;
 box-shadow:0 10px 32px rgba(30,50,80,.09)
}
.logo{
 width:62px;height:62px;margin:0 auto 13px;border-radius:18px;
 display:grid;place-items:center;background:#eef4ff;font-size:31px
}
h1{margin:0;font-size:34px;letter-spacing:1.5px}
.subtitle{margin:9px 0 0;color:#667085;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{
 min-height:155px;background:#fff;border:1px solid #dfe6ef;border-radius:22px;
 padding:24px;text-decoration:none;color:#172033;
 box-shadow:0 7px 24px rgba(30,50,80,.08);
 display:flex;flex-direction:column;justify-content:space-between;
 transition:.15s ease
}
.card:hover{transform:translateY(-3px);box-shadow:0 11px 30px rgba(30,50,80,.13)}
.badge{
 display:inline-block;width:max-content;padding:6px 10px;border-radius:999px;
 background:#eef4ff;color:#425b82;font-size:12px;font-weight:700;letter-spacing:.5px
}
.card:nth-child(2) .badge{background:#edf7f4;color:#356557}
.name{font-size:21px;font-weight:800;line-height:1.25;margin-top:18px}
.go{font-size:14px;color:#667085;margin-top:14px}
.footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:24px}
@media(max-width:600px){
 body{padding:20px 12px}.grid{grid-template-columns:1fr}
 .hero{padding:24px 18px}h1{font-size:30px}.card{min-height:135px}
}
</style>
</head>
<body>
<div class="shell">
 <section class="hero">
   <div class="logo">◆</div>
   <h1>KINO WEB</h1>
   <p class="subtitle">Κεντρική σελίδα επιλογής</p>
 </section>

 <div class="grid">
   <a class="card" href="Ligontes%20x2%20Check%20WEB.html">
     <span class="badge">LIGONTES</span>
     <div class="name">LIGONTES X2<br>CHECK WEB</div>
     <div class="go">Άνοιγμα σελίδας →</div>
   </a>

   <a class="card" href="Dekades%20x2%20Check%20WEB.html">
     <span class="badge">DEKADES</span>
     <div class="name">DEKADES X2<br>CHECK WEB</div>
     <div class="go">Άνοιγμα σελίδας →</div>
   </a>
 </div>

 <div class="footer">KINO WEB</div>
</div>
</body>
</html>
